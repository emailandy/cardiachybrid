# mapping/registry.yaml — coverage contract, canonical event stream → REDCap
# 911 variables (909 dictionary + record_id + video_review_complete)
# Exactly ONE of each top-level key. Duplicates are silently last-wins in PyYAML.
version: 1
dict_version: "@FROM_dict_version.txt"

defaults:
  source_class: AI_DIRECT
  difficulty: MEDIUM
  coverage_channels: [visual, speech]

# ═══ NEVER AI-POPULATED (12 fields) ══════════════════════════════════════════
# Authoritative for these fields. They do NOT appear in sections below.
never_ai:
  - field: review_trigger
    source_class: HUMAN_ONLY
    difficulty: NOT_EXTRACTABLE
    note: "REQUIRED field. Administrative metadata, not in the video."
  - field: review_trigger_other
    source_class: HUMAN_ONLY
    difficulty: NOT_EXTRACTABLE
  - field: dur_mccd_app_ed_secs_v2
    source_class: REDCAP_CALC
    note: "Server-computed datediff. Excluded from import payload."
  - field: duration_ventilator_place_v2
    source_class: REDCAP_CALC
  - pattern: "operator_ed_{i}_v2"
    range: [1, 8]
    source_class: ROSTER_JOIN
    difficulty: NOT_EXTRACTABLE
    note: "PGY level is not determinable from video. Model emits
           operator_position into fact_event; a roster join resolves training
           level downstream."

# ═══ SECTIONS (13) ═══════════════════════════════════════════════════════════
sections:

- name: ed_details
  fields:
  - {field: ohca_ihca, rule: case_field, key: ohca_ihca, vocab: ohca_ihca,
     source_class: AI_DERIVED, difficulty: LOW,
     owning_event_types: [patient_enters_room, ems_handoff_begin,
                          compression_interruption, cpr_initiated_ed]}
  - {field: video_start_late, rule: case_field, key: video_start_late,
     vocab: yes_no_1_2, source_class: AI_DERIVED, difficulty: LOW,
     owning_event_types: [patient_enters_room, compression_interruption]}
  - {field: time_first_team_member_ent_v2, rule: first_of,
     event_type: first_team_member_enters, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: LOW,
     gate_null_when: "video_start_late == yes"}
  - {field: time_pt_enters_room_v2, rule: first_of,
     event_type: patient_enters_room, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: LOW,
     gate_null_when: "video_start_late == yes"}
  - {field: video_brought_by_ems, rule: case_field, key: brought_by_ems,
     vocab: yes_no_1_2, source_class: AI_DERIVED, difficulty: LOW,
     owning_event_types: [ems_handoff_begin, patient_enters_room]}
  - {field: video_ems_handoff, rule: gate_3way, event_type: ems_handoff_begin,
     coverage_channels: [speech], source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_bed_transfer_comp_v2, rule: first_of,
     event_type: bed_transfer_complete, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: cpr_in_progress_upon_ed_v2, rule: case_field,
     key: cpr_in_progress_upon_arrival, vocab: cpr_on_arrival,
     source_class: AI_DERIVED, difficulty: MEDIUM,
     owning_event_types: [compression_interruption, rosc_detected,
                          patient_enters_room]}
  - {field: time_cpr_initiated_in_ed_v2, rule: first_of,
     event_type: cpr_initiated_ed, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: LOW}
  - {field: ems_pads_switched_ed_v2, rule: case_field, key: ems_pads_switched,
     vocab: ems_pads_switched, source_class: AI_DERIVED, difficulty: HIGH,
     expected_utd_floor: 0.20, owning_event_types: [pad_application]}
  - {field: did_ed_apply_pads_v2, rule: gate_yesno, event_type: pad_application,
     where: {applied_by: ed_team}, source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_ed_defibrillator_pads_v2, rule: first_of,
     event_type: pad_application, where: {applied_by: ed_team}, emit: t_end_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: iv_io_in_place_arrival, rule: gate_3way, event_type: vascular_access,
     where: {present_on_arrival: true}, coverage_channels: [visual],
     source_class: AI_DERIVED, difficulty: HIGH, expected_utd_floor: 0.25}
  - {field: video_access_type, rule: checkbox, kind: checkbox,
     event_type: vascular_access, where: {present_on_arrival: true},
     emit: access_types, vocab: access_type, difficulty: HIGH,
     expected_utd_floor: 0.30}
  - {field: access_confirmed_time, rule: first_of, event_type: vascular_access,
     where: {confirmed: true}, emit: t_confirmed_s,
     transform: to_redcap_datetime, difficulty: HIGH,
     note: "First flush OR first med through the line, whichever is earlier.
            NOT the moment of cannulation."}

- name: pad_and_defibrillation
  fields:
  - {field: initial_ed_pad_place_v2, rule: first_of, event_type: pad_application,
     where: {applied_by: ed_team}, emit: position, vocab: pad_position,
     difficulty: HIGH, expected_utd_floor: 0.30}
  - {field: pad_place_position_changed_v2, rule: gate_3way,
     event_type: pad_reposition, coverage_channels: [visual],
     vocab_override: yes_no_unknown, source_class: AI_DERIVED, difficulty: HIGH}
  - {field: new_pad_position, rule: last_of, event_type: pad_reposition,
     emit: position, vocab: pad_position_4, difficulty: HIGH,
     note: "DECISION Q-002: last reposition. Surplus changes go to
            ed_defib_notes_v2."}
  - {field: time_of_initial_ed_rhythm_v2, rule: first_of, event_type: rhythm_check,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: ems_ed_pads_switched_v2, rule: first_of, event_type: rhythm_check,
     emit: pads_source, vocab: pads_source, difficulty: HIGH,
     expected_utd_floor: 0.25}
  - {field: first_ed_rhythm_v2, rule: first_of, event_type: rhythm_check,
     emit: rhythm, vocab: rhythm_10, difficulty: HIGH, expected_utd_floor: 0.15}
  - {field: shockable_rhy_ed_v2, rule: gate_3way, event_type: rhythm_check,
     where: {rhythm_shockable: true}, coverage_channels: [visual, monitor, speech],
     source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: time_first_shockable_v2, rule: first_of, event_type: rhythm_check,
     where: {rhythm_shockable: true}, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: was_pt_defib_ed_v2, rule: gate_yesno,
     event_type: defibrillation_shock, source_class: AI_DERIVED, difficulty: LOW}
  - {field: num_times_defib_ed_v2, rule: count, event_type: defibrillation_shock,
     cap: 30, source_class: AI_DERIVED, difficulty: LOW}
  - {field: ed_defib_notes_v2, rule: notes, section: defibrillation,
     source_class: AI_NARRATIVE}

- name: mccd
  fields:
  - {field: mccd_applied_ems_v2, rule: gate_3way,
     event_type: mccd_application_start, where: {applied_by: ems},
     coverage_channels: [visual], vocab_override: yes_no_1_2,
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: mccd_type_ems_v2, rule: first_of, event_type: mccd_application_start,
     where: {applied_by: ems}, emit: device_type, vocab: mccd_type,
     difficulty: LOW,
     note: "Branching references [onset_ca_occur], absent from this instrument
            (RC-1043)."}
  - {field: other_mccd_used_ems_v2, rule: conditional_text,
     gate: "mccd_type_ems == other", emit: device_type_other_text,
     source_class: CONDITIONAL}
  - {field: mccd_used_in_the_ed_v2, rule: gate_3way,
     event_type: mccd_compressions_effective, vocab_override: yes_no_1_2,
     coverage_channels: [visual, audio_device], source_class: AI_DERIVED,
     difficulty: LOW}
  - {field: how_mccd_used_in_ed_v2, rule: case_field, key: mccd_ed_provenance,
     vocab: mccd_provenance, source_class: AI_DERIVED, difficulty: MEDIUM,
     owning_event_types: [mccd_application_start, mccd_compressions_effective]}
  - {field: ed_mccd_success, rule: case_field, key: ed_mccd_outcome,
     vocab: mccd_success, source_class: AI_DERIVED, difficulty: MEDIUM,
     owning_event_types: [mccd_compressions_effective, mccd_removed]}
  - {field: mccd_type_ed_v2, rule: first_of, event_type: mccd_application_start,
     where: {applied_by: ed_team}, emit: device_type, vocab: mccd_type,
     difficulty: LOW}
  - {field: specify_other_mccd_ed_v2, rule: conditional_text,
     gate: "mccd_type_ed == other", emit: device_type_other_text,
     source_class: CONDITIONAL}
  - {field: backboard_prior_transf, rule: first_of,
     event_type: mccd_application_start, emit: backboard_preplaced,
     vocab: yes_no_utd, difficulty: HIGH, expected_utd_floor: 0.40,
     gate_null_when: "video_start_late == yes"}
  - {field: starttime_mccd_app_ed_v2, rule: first_of,
     event_type: mccd_application_start, where: {applied_by: ed_team},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: endtime_mccd_app_ed_v2, rule: first_of,
     event_type: mccd_compressions_effective, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM,
     fallback: "If ed_mccd_outcome == abandoned, use the abandonment timestamp."}
  - {field: mccd_obstacles, rule: checkbox, kind: checkbox,
     event_type: mccd_application_start, emit: obstacles, vocab: mccd_obstacle,
     suppress_codes: [1, 2], difficulty: HIGH,
     note: "GOV-07: codes 1 (obesity) and 2 (cachexia) hard-suppressed to 0.
            Body-habitus assertion is inappropriate for an automated system."}
  - {field: mccd_obstacle_other, rule: conditional_text,
     gate: "obstacles contains other", emit: obstacle_other_text,
     source_class: CONDITIONAL}
  - {field: mccd_ad_yesno_v2, rule: gate_3way, event_type: mccd_adjustment,
     coverage_channels: [visual, audio_device], source_class: AI_DERIVED,
     difficulty: MEDIUM}
  - {field: type_adjust_mccd_v2, rule: checkbox, kind: checkbox,
     event_type: mccd_adjustment, emit: adjustment_categories,
     vocab: mccd_adjust_type, difficulty: MEDIUM}
  - {field: other_mccd_adjust_v2, rule: conditional_text,
     gate: "adjustment_categories contains other", emit: adjustment_other_text,
     source_class: CONDITIONAL}
  - {field: starttime_mccd_adj_ed_v2, rule: first_of, event_type: mccd_adjustment,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: endtime_mccd_adj_ed_v2, rule: last_of, event_type: mccd_adjustment,
     emit: t_end_s, transform: to_redcap_datetime, difficulty: MEDIUM,
     note: "DECISION Q-004: envelope (first start → last end)."}
  - {field: mechanical_to_manual_v2, rule: gate_3way,
     event_type: compression_mode_change, where: {from: mechanical, to: manual},
     vocab_override: mech_to_manual, coverage_channels: [visual, audio_device],
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_mechanical_chest_comp_v2, rule: first_of,
     event_type: compression_mode_change, where: {from: mechanical, to: manual},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: LOW}
  - {field: ed_details_notes_v2, rule: notes, section: ed_details_and_mccd,
     source_class: AI_NARRATIVE}

- name: initial_pulse_check
  fields:
  - {field: time_initial_pulse_check_v2, rule: first_of, event_type: pulse_check,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: loc_initial_pulse_check_v2, rule: checkbox, kind: checkbox,
     scope: first_of, event_type: pulse_check, emit: locations,
     vocab: pulse_loc_initial, difficulty: MEDIUM,
     note: "⚠ Uses pulse_loc_initial (3=Radial, 4=Brachial). The CCI field uses
            pulse_loc_cci (3=Brachial, 4=Radial). Codes 3/4 are SWAPPED between
            these two fields. Never share a vocabulary."}

- name: cci
  fields:
  - {field: num_cci_v2, rule: count, interval_type: cci, cap: 30,
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: ed_cci_notes_v2, rule: notes, section: cci,
     source_class: AI_NARRATIVE}

- name: airway
  fields:
  - {field: adv_airway_ed_arrival, rule: case_field, key: adv_airway_on_arrival,
     vocab: airway_on_arrival, source_class: AI_DERIVED, difficulty: HIGH,
     expected_utd_floor: 0.20, owning_event_types: [ems_handoff_begin,
                                                    patient_enters_room]}
  - {field: adv_airway_attempted_ed_v2, rule: gate_3way,
     event_type: airway_attempt, coverage_channels: [visual, airway],
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: num_ed_adv_airway_att_v2, rule: count, event_type: airway_attempt,
     cap: 8, source_class: AI_DERIVED, difficulty: LOW}
  - {field: airway_con_method_ed_final_v2, rule: checkbox, kind: checkbox,
     scope: last_of, event_type: airway_confirmation, emit: methods,
     vocab: airway_confirm_method, difficulty: MEDIUM}
  - {field: ett_intub_confirm_time_v2, rule: nth_distinct_attribute,
     event_type: airway_confirmation, attribute: method, n: 2, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: HIGH,
     note: "Completion of the SECOND distinct confirmation method."}
  - {field: ed_airway_notes_v2, rule: notes, section: airway,
     source_class: AI_NARRATIVE}

- name: ventilation
  fields:
  - {field: any_ventilation_delays_v2, rule: gate_3way,
     event_type: ventilation_delay, coverage_channels: [visual, audio_device],
     vocab_override: yes_no_unknown, source_class: AI_DERIVED, difficulty: HIGH,
     expected_utd_floor: 0.15}
  - {field: how_many_ventilation_delay_v2, rule: count,
     interval_type: vent_delay, cap: 5, source_class: AI_DERIVED,
     difficulty: HIGH}
  - {field: placed_vent_intraarrest_v2, rule: gate_3way,
     event_type: ventilator_placement, coverage_channels: [visual, audio_device],
     vocab_override: yes_no_unknown, source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: start_ventilator_place_v2, rule: first_of,
     event_type: ventilator_placement, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: end_ventilator_place_v2, rule: first_of,
     event_type: ventilator_placement, emit: t_end_s,
     transform: to_redcap_datetime, blank_when_null: true, difficulty: MEDIUM}
  - {field: ventilation_notes_v2, rule: notes, section: ventilation,
     source_class: AI_NARRATIVE}

- name: drugs
  fields:
  - {field: epi_given_ed_v2, rule: gate_3way,
     event_type: medication_administration, where: {drug: epinephrine},
     coverage_channels: [speech], source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_epi_ed_v2, rule: first_of,
     event_type: medication_administration, where: {drug: epinephrine},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: lido_given_ed_v2, rule: gate_3way,
     event_type: medication_administration, where: {drug: lidocaine},
     coverage_channels: [speech], source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_lido_ed_v2, rule: first_of,
     event_type: medication_administration, where: {drug: lidocaine},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: amio_given_ed_v2, rule: gate_3way,
     event_type: medication_administration, where: {drug: amiodarone},
     coverage_channels: [speech], source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_amido_ed_v2, rule: first_of,
     event_type: medication_administration, where: {drug: amiodarone},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM,
     note: "Field name contains a typo in the source dictionary ('amido').
            Preserved verbatim — the API matches on exact name."}
  - {field: thromb_given_ed_v2, rule: gate_3way,
     event_type: medication_administration, where: {drug_class: thrombolytic},
     coverage_channels: [speech], source_class: AI_DERIVED, difficulty: LOW}
  - {field: name_thromb_ed_v2, rule: first_of,
     event_type: medication_administration, where: {drug_class: thrombolytic},
     emit: drug_name_text, source_class: CONDITIONAL, difficulty: MEDIUM}
  - {field: decision_time_thromb_ed, rule: first_of,
     event_type: medication_administration, where: {drug_class: thrombolytic},
     emit: t_decision_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: time_thromb_ed_v2, rule: first_of,
     event_type: medication_administration, where: {drug_class: thrombolytic},
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: ed_drugs_notes_v2, rule: notes, section: drugs,
     source_class: AI_NARRATIVE}

- name: ecmo
  fields:
  - {field: ecmo_called_ed_v2, rule: gate_3way, event_type: ecmo_called,
     coverage_channels: [speech], vocab_override: ecmo_gate_5,
     source_class: AI_DERIVED, difficulty: LOW,
     note: "⚠ 'not applicable' is code 5 here; the other two ECMO gates use 4."}
  - {field: time_ecmo_called, rule: first_of, event_type: ecmo_called,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: LOW}
  - {field: ecmo_initiated_ed_v2, rule: gate_3way,
     event_type: ecmo_cannulation_start, coverage_channels: [visual, speech],
     vocab_override: ecmo_gate_4, source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: time_ecmo_initiated, rule: first_of,
     event_type: ecmo_cannulation_start, emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {field: ecmo_success_ed_v2, rule: gate_3way,
     event_type: ecmo_flow_established, coverage_channels: [visual, speech],
     vocab_override: ecmo_gate_4, source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: time_ecmo_success, rule: first_of, event_type: ecmo_flow_established,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: MEDIUM}

- name: rosc
  fields:
  - {field: any_episodes_rosc_ed_v2, rule: gate_3way, event_type: rosc_detected,
     coverage_channels: [speech, monitor], source_class: AI_DERIVED,
     difficulty: LOW}
  - {field: num_rosc_episodes_ed_v2, rule: count, interval_type: rosc, cap: 20,
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: rosc_notes_v2, rule: notes, section: rosc, source_class: AI_NARRATIVE}

- name: end_of_resuscitation
  fields:
  - {field: was_resuscitation_stopped_v2, rule: gate_3way,
     event_type: dnr_confirmed, coverage_channels: [speech],
     vocab_override: yes_no_unknown, source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: reason_non_med_stop_cpr_v2, rule: checkbox, kind: checkbox,
     event_type: dnr_confirmed, emit: dnr_basis, vocab: dnr_reason,
     difficulty: MEDIUM}
  - {field: dead_ed_v2, rule: gate_3way, event_type: death_pronounced,
     coverage_channels: [speech], vocab_override: yes_no_unknown,
     source_class: AI_DERIVED, difficulty: LOW}
  - {field: time_dead_ed_v2, rule: first_of, event_type: death_pronounced,
     emit: t_start_s, transform: to_redcap_datetime, difficulty: LOW}
  - {field: ultrasound_dead_ed_v2, rule: gate_3way, event_type: pocus_cardiac,
     scope: within_60s_before_pronouncement, coverage_channels: [visual, speech],
     vocab_override: yes_no_unknown, source_class: AI_DERIVED, difficulty: MEDIUM}
  - {field: time_vid_stop_pt_leaves_v2, rule: first_of,
     event_type: patient_leaves_room, emit: t_start_s,
     transform: to_redcap_datetime, fallback: end_of_video, difficulty: LOW}

- name: team_ratings
  fields:
  - {field: team1_v2,  rule: team_score, item: team1,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team2_v2,  rule: team_score, item: team2,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team3_v2,  rule: team_score, item: team3,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team4_v2,  rule: team_score, item: team4,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team5_v2,  rule: team_score, item: team5,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team6_v2,  rule: team_score, item: team6,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team7_v2,  rule: team_score, item: team7,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team8_v2,  rule: team_score, item: team8,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team9_v2,  rule: team_score, item: team9,  source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team10_v2, rule: team_score, item: team10, source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team11_v2, rule: team_score, item: team11, source_class: AI_DERIVED, difficulty: HIGH}
  - {field: team12_v2, rule: team_score, item: team12, source_class: AI_DERIVED, difficulty: HIGH,
     note: "Separate P4B call; must NOT see items 1-11 (anchoring)."}

- name: redcap_internal
  fields:
  - {field: record_id, rule: passthrough, source_class: AI_DERIVED,
     difficulty: LOW, system_field: true, note: "= case_id"}
  - {field: video_review_complete, rule: passthrough, source_class: AI_DERIVED,
     difficulty: LOW, system_field: true,
     note: "1 (Unverified) on AI submission; 2 (Complete) after human sign-off."}

# ═══ REPEATING GROUPS (5) ════════════════════════════════════════════════════
groups:

- name: defib
  count_field: num_times_defib_ed_v2
  max: 30
  source: event
  event_type: defibrillation_shock
  order_by: t_start_s
  truncation: earliest
  overflow_note_field: ed_defib_notes_v2
  fields:
  - {pattern: "time_ed_defib_{i}_v2", emit: t_start_s,
     transform: to_redcap_datetime, difficulty: LOW, detector: S3}
  - {pattern: "position_ed_defib_{i}_v2", emit: pad_position,
     vocab: pad_position, difficulty: HIGH, expected_utd_floor: 0.30,
     note: "Re-established INDEPENDENTLY at every shock. Never inherited."}

- name: cci
  count_field: num_cci_v2
  max: 30
  source: interval
  interval_type: cci
  min_duration_s: 3.0
  order_by: t_start_s
  truncation: longest_duration
  overflow_note_field: ed_cci_notes_v2
  overflow_forces_human_review: true
  fields:
  - {pattern: "start_time_cci_{i}_v2", emit: t_start_s,
     transform: to_redcap_datetime, difficulty: LOW, detector: S1+S2}
  - {pattern: "end_time_cci_{i}_v2", emit: t_end_s,
     transform: to_redcap_datetime, blank_when_null: true, difficulty: LOW,
     detector: S1+S2,
     note: "Blank if compressions stopped for ROSC or termination."}
  - {pattern: "reason_cci_{i}_v2", kind: checkbox, emit: reasons,
     vocab: cci_reason, per_index_vocab: true, difficulty: MEDIUM,
     note: "⚠ Index 1 has 20 codes (no 21=ROSC); indices 2-30 have 21."}
  - {pattern: "other_reason_cci_{i}_v2", rule: conditional_text,
     gate: "reasons contains other", emit: other_reason_text,
     source_class: CONDITIONAL}
  - {pattern: "sono_window_cci_{i}", emit: sono_window, vocab: sono_window,
     gate: "reasons contains chest_us", default_when_gated_null: 4,
     difficulty: MEDIUM,
     known_bug: "RC-1041 — branching references reason_cci_2_v2(4) at index 1."}
  - {pattern: "echo_success_cci_{i}", emit: echo_success, vocab: yes_no_utd,
     gate: "reasons contains chest_us", default_when_gated_null: 3,
     difficulty: HIGH, expected_utd_floor: 0.25}
  - {pattern: "us_pulse_cci_{i}", emit: us_pulse_site, vocab: us_pulse_site_3,
     gate: "reasons contains us_pulse", default_when_gated_null: 3,
     difficulty: MEDIUM}
  - {pattern: "us_pulse_present_cci_{i}", emit: us_pulse_present,
     vocab: yes_no_utd, gate: "reasons contains us_pulse",
     default_when_gated_null: 3, difficulty: HIGH, expected_utd_floor: 0.30}
  - {pattern: "aline_cci_{i}", emit: aline_present, vocab: yes_no_1_2,
     difficulty: MEDIUM}
  - {pattern: "aline_sbp_cci_{i}", emit: aline_sbp, range: [0, 200],
     gate: "aline_present == true", difficulty: HIGH, expected_utd_floor: 0.35,
     detector: S4_monitor_ocr,
     note: "HIGHEST value during the interruption. Monitor OCR only."}
  - {pattern: "aline_dbp_cci_{i}", emit: aline_dbp, range: [0, 120],
     gate: "aline_present == true", difficulty: HIGH, expected_utd_floor: 0.35,
     detector: S4_monitor_ocr}
  - {pattern: "loc_pulse_check_cci_{i}", kind: checkbox,
     emit: pulse_check_locations, vocab: pulse_loc_cci,
     gate: "reasons contains pulse_check", difficulty: MEDIUM,
     note: "⚠ pulse_loc_cci: 3=Brachial, 4=Radial. loc_initial_pulse_check_v2
            uses 3=Radial, 4=Brachial. Codes SWAPPED. Distinct vocabularies."}
  - {pattern: "pocus_non_pulse_cci_{i}_v2", rule: gate_3way,
     event_type: pocus_other, scope: within_interval,
     coverage_channels: [visual], emit: pocus_other_used,
     vocab_override: yes_no_unknown, difficulty: MEDIUM}
  - {pattern: "rhythm_during_cci_{i}_v2", emit: rhythm_code,
     vocab: cci_rhythm_9, gate: "reasons contains rhythm_determination",
     difficulty: MEDIUM, inference_permitted: true,
     note: "SOLE documented exception to the Prime Directive. The dictionary
            explicitly instructs inferring rhythm from the team's intervention."}
  - {pattern: "reason_mccd_adj_cci_{i}_v2", kind: checkbox,
     emit: mccd_adjust_reasons, vocab: mccd_adjust_reason_8,
     gate: "reasons contains mccd_adjusted", difficulty: HIGH,
     expected_utd_floor: 0.20,
     note: "240 export columns. Requires the 8-way mccd_adjustment taxonomy."}

- name: airway
  count_field: num_ed_adv_airway_att_v2
  max: 8
  source: event
  event_type: airway_attempt
  order_by: t_start_s
  truncation: earliest
  overflow_note_field: ed_airway_notes_v2
  fields:
  - {pattern: "cpr_ongoing_ed_intub_{i}_v2", emit: cpr_ongoing,
     vocab: yes_no_utd, difficulty: LOW,
     cross_check: "Verify against sensor S1 compressions_active at t_start_s."}
  - {pattern: "type_compress_intub_{i}_v2", emit: compression_type,
     vocab: compression_type, gate: "cpr_ongoing == yes", difficulty: LOW}
  - {pattern: "starttime_intub_{i}_v2", emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {pattern: "endtime_intub_{i}_v2", emit: t_end_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {pattern: "type_airway_ed_intub_{i}_v2", emit: device,
     vocab: airway_device_10, difficulty: HIGH, expected_utd_floor: 0.10,
     note: "Codes 2 vs 3 (hyperangulated vs geometric VL) rarely resolvable;
            expect ≥50% of VL attempts on code 4."}
  - {pattern: "vomiting_ed_intub_{i}_v2", emit: vomit_blood_aspiration,
     vocab: yes_no_utd, difficulty: MEDIUM}
  - {pattern: "intub_assist_ed_{i}_v2", emit: adjunct, vocab: intub_assist,
     difficulty: MEDIUM,
     note: "Instrument is a RADIO — bougie + fiberoptic is uncodeable.
            DECISION Q-005: bougie takes precedence."}

- name: rosc
  count_field: num_rosc_episodes_ed_v2
  max: 20
  source: interval
  interval_type: rosc
  order_by: t_start_s
  truncation: earliest
  overflow_note_field: rosc_notes_v2
  fields:
  - {pattern: "start_rosc_{i}_v2", emit: t_start_s,
     transform: to_redcap_datetime, difficulty: MEDIUM}
  - {pattern: "end_rosc_{i}_v2", emit: t_end_s, transform: to_redcap_datetime,
     blank_when_null: true, difficulty: MEDIUM}
  - {pattern: "rhythm_rosc_{i}_v2", emit: rhythm, vocab: rosc_rhythm_6,
     difficulty: HIGH, expected_utd_floor: 0.25,
     known_bug: "RC-1042 — index 15 branching uses '>15' not '>=15'."}
  - {pattern: "pulse_check_meth_rosc_{i}_v2", kind: checkbox,
     emit: detection_methods, vocab: pulse_method_4, difficulty: MEDIUM}
  - {pattern: "vitals_obtained_rosc_{i}_v2", rule: gate_yesno,
     event_type: vitals_reading, scope: linked_to_interval, difficulty: MEDIUM}
  - {pattern: "time_vitals_rosc_{i}_v2", emit: vitals_t_s,
     transform: to_redcap_datetime, gate: "vitals_obtained == true",
     difficulty: MEDIUM}
  - {pattern: "hr_rosc_{i}_v2", emit: hr, gate: "vitals_obtained == true",
     difficulty: HIGH, expected_utd_floor: 0.30, detector: S4_monitor_ocr}
  - {pattern: "sbp_rosc_{i}_v2", emit: sbp, gate: "vitals_obtained == true",
     difficulty: HIGH, expected_utd_floor: 0.30, detector: S4_monitor_ocr}
  - {pattern: "dbp_rosc_{i}_v2", emit: dbp, gate: "vitals_obtained == true",
     difficulty: HIGH, expected_utd_floor: 0.30, detector: S4_monitor_ocr}
  - {pattern: "spo2_rosc_{i}_v2", emit: spo2, gate: "vitals_obtained == true",
     difficulty: HIGH, expected_utd_floor: 0.35, detector: S4_monitor_ocr}
  - {pattern: "etco2_rosc_{i}_v2", emit: etco2, gate: "vitals_obtained == true",
     difficulty: HIGH, expected_utd_floor: 0.35, detector: S4_monitor_ocr}

- name: vent_delay
  count_field: how_many_ventilation_delay_v2
  max: 5
  source: interval
  interval_type: vent_delay
  min_duration_s: 20.0
  order_by: t_start_s
  truncation: longest_duration
  overflow_note_field: ventilation_notes_v2
  fields:
  - {pattern: "vent_delay_start_{i}_v2", emit: t_start_s,
     transform: to_redcap_datetime, difficulty: HIGH}
  - {pattern: "vent_delay_end_{i}_v2", emit: t_end_s,
     transform: to_redcap_datetime, difficulty: HIGH}

