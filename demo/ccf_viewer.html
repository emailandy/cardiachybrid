<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>resus_qc — Chest Compression Fraction (CCF) Clinical Viewer</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --bg-header: #0f172a;
      --bg-hover: #1e293b;
      --border-color: #334155;
      --border-strong: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .header-title { font-size: 1.1rem; font-weight: 600; margin-left: 0.75rem; }
    .btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover { background: #0369a1; }
    main {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .banner-warning {
      background-color: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.5);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      color: #fda4af;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .banner-warning strong { color: #ffe4e6; display: block; margin-bottom: 0.35rem; font-size: 1rem; }
    .caveats-card {
      background-color: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 8px;
      padding: 1.25rem;
      font-size: 0.88rem;
    }
    .caveats-card h3 { color: var(--accent-amber); font-size: 0.95rem; margin-bottom: 0.5rem; }
    .caveats-card ul { padding-left: 1.25rem; }
    .caveats-card li { margin-bottom: 0.35rem; color: var(--text-main); }
    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .meta-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .meta-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .meta-val { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
    .scorecards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .scorecard {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .scorecard-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .scorecard-val { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }
    .scorecard-sub { font-size: 0.8rem; color: var(--text-dim); }
    .table-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; background-color: var(--bg-hover); }
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      background-color: var(--bg-card);
      border: 1px dashed var(--border-strong);
      border-radius: 12px;
      color: var(--text-muted);
    }
    .error-card {
      background-color: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--accent-rose);
      color: #fda4af;
      padding: 1.5rem;
      border-radius: 8px;
      font-weight: 600;
    }
    #file-input { display: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="logo-badge">RESUS_QC</span>
      <span class="header-title">Chest Compression Fraction (CCF) Clinical Report Viewer</span>
    </div>
    <div>
      <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
        <span>📂 Load Report JSON</span>
      </button>
      <input type="file" id="file-input" accept=".json" onchange="handleFileSelect(event)" />
    </div>
  </header>

  <main id="app-container">
    <div class="empty-state" id="empty-state">
      <h2>No Report Loaded</h2>
      <p style="margin-top: 0.5rem;">Please load a verified CCF Quality Report JSON generated by <code>sensors/ccf_report.py</code>.</p>
    </div>
    <div id="report-view" style="display: none; display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </main>

  <script>
    function validateReportSchema(data) {
      if (!data || typeof data !== 'object') {
        throw new Error('Loaded file is not a valid JSON object.');
      }
      const requiredKeys = ['case_id', 'total_case_duration_s', 'readership_banner', 'caveats'];
      for (const k of requiredKeys) {
        if (!(k in data)) {
          throw new Error(`Invalid Report Contract: Missing mandatory key '${k}'. Naked CCF reports without clinical safety banners and validation caveats are rejected.`);
        }
      }
      if (!Array.isArray(data.readership_banner) || data.readership_banner.length === 0) {
        throw new Error('Invalid Report Contract: readership_banner must be a non-empty list of clinical warnings.');
      }
      if (!Array.isArray(data.caveats) || data.caveats.length === 0) {
        throw new Error('Invalid Report Contract: caveats must be a non-empty list of scientific validation caveats.');
      }
    }

    function renderReport(data) {
      const container = document.getElementById('report-view');
      const emptyState = document.getElementById('empty-state');
      emptyState.style.display = 'none';
      container.style.display = 'flex';
      container.innerHTML = '';

      // 1. Mandatory Readership Banner
      const bannerDiv = document.createElement('div');
      bannerDiv.className = 'banner-warning';
      bannerDiv.innerHTML = `
        <strong>${data.readership_banner[0]}</strong>
        ${data.readership_banner.slice(1).join('<br>')}
      `;
      container.appendChild(bannerDiv);

      // 2. Mandatory Validation Caveats Card
      const caveatsDiv = document.createElement('div');
      caveatsDiv.className = 'caveats-card';
      caveatsDiv.innerHTML = `
        <h3>Mandatory Scientific & Clinical Caveats</h3>
        <ul>
          ${data.caveats.map(c => `<li>${c}</li>`).join('')}
        </ul>
      `;
      container.appendChild(caveatsDiv);

      // 3. Metadata Banner
      const metaGrid = document.createElement('div');
      metaGrid.className = 'metadata-grid';
      metaGrid.innerHTML = `
        <div class="meta-item">
          <span class="meta-label">Case ID</span>
          <span class="meta-val">${data.case_id}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Validation Status</span>
          <span class="meta-val" style="color: ${data.validation_status && (data.validation_status.includes('COMPARED') || data.validation_status.includes('VALIDATED')) ? 'var(--accent-cyan)' : 'var(--accent-amber)'};">
            ${data.validation_status || 'Unvalidated'}
          </span>
        </div>
        <div class="meta-item">
          <span class="meta-label">T0 Clock Anchor</span>
          <span class="meta-val">${data.t0_iso || 'Unanchored'} (${data.t0_source || 'none'})</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Clinical Window</span>
          <span class="meta-val">${data.interval_window_s ? `${data.interval_window_s[0]}s – ${data.interval_window_s[1]}s` : 'Full Track'}</span>
        </div>
      `;
      container.appendChild(metaGrid);

      // 4. Scorecards Grid
      const scoreGrid = document.createElement('div');
      scoreGrid.className = 'scorecards-grid';

      let ccfDisplay = 'ABSTAINED';
      let ccfSub = data.ccf_abstain_reason || 'Abstained under clinical rules';
      if (!data.ccf_abstained && data.ccf_percent != null) {
        ccfDisplay = `${data.ccf_percent.toFixed(2)}%`;
        ccfSub = `Ratio: ${data.ccf.toFixed(4)}`;
      }

      const totalDurSecs = Number(data.total_case_duration_s || 0);
      const cprDurSecs = data.total_cpr_duration_s != null ? Number(data.total_cpr_duration_s) : null;
      const cciDurSecs = Number(data.total_cci_duration_s || 0);

      scoreGrid.innerHTML = `
        <div class="scorecard">
          <span class="scorecard-title">CCF Score (QI Metric)</span>
          <div class="scorecard-val" style="color: ${data.ccf_abstained ? 'var(--accent-amber)' : 'var(--text-main)'};">${ccfDisplay}</div>
          <span class="scorecard-sub">${ccfSub}</span>
        </div>
        <div class="scorecard">
          <span class="scorecard-title">Case Duration</span>
          <div class="scorecard-val">${(totalDurSecs / 60).toFixed(1)}m</div>
          <span class="scorecard-sub">${totalDurSecs.toFixed(2)}s total</span>
        </div>
        <div class="scorecard">
          <span class="scorecard-title">Active CPR Duration</span>
          <div class="scorecard-val">${cprDurSecs != null ? `${(cprDurSecs / 60).toFixed(1)}m` : 'N/A'}</div>
          <span class="scorecard-sub">${cprDurSecs != null ? `${cprDurSecs.toFixed(2)}s active` : 'Abstained'}</span>
        </div>
        <div class="scorecard">
          <span class="scorecard-title">CCF Pauses (>=1.0s tier)</span>
          <div class="scorecard-val">${(cciDurSecs / 60).toFixed(1)}m</div>
          <span class="scorecard-sub">${cciDurSecs.toFixed(2)}s (${(data.ccf_intervals || []).length} pauses${data.validation && data.validation.interval_stream_pause_duration_s ? `; raw: ${data.validation.interval_stream_pause_duration_s}s` : ''})</span>
        </div>
        <div class="scorecard">
          <span class="scorecard-title">Reported CCIs (>=5.0s tier)</span>
          <div class="scorecard-val">${(data.reported_intervals || []).length}</div>
          <span class="scorecard-sub">${(data.ccf_intervals || []).length} CCF tier pauses</span>
        </div>
      `;
      container.appendChild(scoreGrid);

      // 5. Reported Intervals Table
      const tableSec = document.createElement('div');
      tableSec.className = 'table-section';
      const intervals = data.reported_intervals || data.ccf_intervals || [];
      tableSec.innerHTML = `
        <h3 style="font-size: 1rem; color: var(--text-main);">Clinical Pause Intervals (${intervals.length} intervals)</h3>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Start (s)</th>
                <th>End (s)</th>
                <th>Duration (s)</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody>
              ${intervals.length === 0 ? '<tr><td colspan="6" style="text-align: center; color: var(--text-dim);">No intervals reported in clinical window.</td></tr>' : ''}
              ${intervals.map(i => `
                <tr>
                  <td><code>${i.id || 'N/A'}</code></td>
                  <td>${i.type || 'compression_interruption'}</td>
                  <td>${Number(i.t_start_s).toFixed(1)}s</td>
                  <td>${Number(i.t_end_s).toFixed(1)}s</td>
                  <td><strong>${Number(i.duration_s).toFixed(1)}s</strong></td>
                  <td>${i.confidence != null ? Number(i.confidence).toFixed(2) : '1.00'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      container.appendChild(tableSec);
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          validateReportSchema(data);
          renderReport(data);
        } catch (err) {
          const container = document.getElementById('report-view');
          const emptyState = document.getElementById('empty-state');
          emptyState.style.display = 'none';
          container.style.display = 'flex';
          container.innerHTML = `
            <div class="error-card">
              <h3>❌ Report Load Error</h3>
              <p style="margin-top: 0.5rem;">${err.message}</p>
            </div>
          `;
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
