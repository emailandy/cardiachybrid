    source_class: UNMAPPED
  - field: mccd_obstacle_other # Difficulty in MCCD placement (other):
    source_class: UNMAPPED
  - field: mccd_ad_yesno_v2 # Were any adjustments made during the initial application of the MCCD in the ED, such as adjusting the patient's position, adjusting the MCCD piston, or troubleshooting the MCCD components?

    source_class: UNMAPPED
  - field: type_adjust_mccd_v2 # What types of adjustments to the MCCD were made?

Check all that apply.
    source_class: UNMAPPED
  - field: other_mccd_adjust_v2 # Please specify other type(s) of MCCD adjustment(s).
    source_class: UNMAPPED
  - field: starttime_mccd_adj_ed_v2 # What was the start time of adjustments?

The time must be AFTER the start time of application and BEFORE the end time of application, as it captures the portion of the total application time spent only on adjustment). 
    source_class: UNMAPPED
  - field: endtime_mccd_adj_ed_v2 # What was the end  time of adjustments?

The time must be AFTER the start time of application and BEFORE the end time of application, as it captures the portion of the total application time spent only on adjustment). 
    source_class: UNMAPPED
