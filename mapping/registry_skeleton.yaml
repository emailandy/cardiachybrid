  - field: type_compress_intub_1_v2 # What type of chest compressions were ongoing during advanced airway attempt #1?
    source_class: UNMAPPED
  - field: starttime_intub_1_v2 # Start time of advanced airway attempt #1

Start time = first insertion of the laryngoscope blade/SGA device into the mouth
    source_class: UNMAPPED
  - field: endtime_intub_1_v2 # End time of advanced airway attempt #1

End time for successful attempt = time of first effective ventilation through the placed device

End time for failed attempt = time when the laryngoscope blade is removed from the mouth
