version: 1
requires_contract_version: 1
requires_dict_version: "e7c08437adcef4a5"
anchors_dir: "prompts/anchors"

system_prompt: "prompts/system/constitution.v2.0.md"

pass_templates:
  pass_1: "prompts/passes/p1_harvest.v2.0.md"
  pass_2: "prompts/passes/p2_verify.v2.0.md"
  pass_3: "prompts/passes/p3_adjudicate.v2.0.md"
  pass_4a: "prompts/passes/p4a_team_items.v2.0.md"
  pass_4b: "prompts/passes/p4b_team_global.v2.0.md"
  pass_5: "prompts/passes/p5_notes.v2.0.md"

fragments:
  coverage_rules: "prompts/fragments/coverage_rules.md"
  timestamp_calibration: "prompts/fragments/timestamp_calibration.md"
