    model: "gemini-3.1-pro-preview"
    temperature: 0.0
    ensemble_k: 1
    thinking: "high"
  pass_4a:
    model: "gemini-3.1-pro-preview"
    temperature: 0.4
    ensemble_k: 3
    thinking: "high"
  pass_4b:
    model: "gemini-3.1-pro-preview"
    temperature: 0.4
    ensemble_k: 3
    thinking: "high"
  pass_5:
    model: "gemini-3.1-pro-preview"
    temperature: 0.3
    ensemble_k: 1
    thinking: "low"
