# Placeholders contract for pass templates (p1_harvest, p2_verify)
# Every placeholder used in a pass template must be declared here with its type, source, and description.

p1_harvest:
  anchor_cards:
    type: yaml_block
    source: anchors
    description: "Sliced anchor cards for event types plausibly present in this window."
  asr_transcript:
    type: markdown_block
    source: sensor
    description: "Authoritative S4 ASR diarized audio transcript in this window."
  chunk_index:
    type: integer
    source: chunker
    description: "1-indexed sequence number of the current video window chunk."
  chunk_total:
    type: integer
    source: chunker
    description: "Total number of video window chunks in the resuscitation recording."
  compression_intervals:
    type: markdown_block
    source: sensor
    description: "Authoritative S1 CPR sensor track compression intervals in this window."
  contract_slice:
    type: markdown_block
    source: contract
    description: "Sliced extraction contract for event types plausibly present in this window."
  contract_version:
    type: string
    source: contract
    description: "Version string of the extraction contract and prompt set."
  device_audio_hits:
    type: markdown_block
    source: sensor
    description: "Authoritative S2 device audio sensor hits in this window."
  monitor_ocr_series:
    type: markdown_block
    source: sensor
    description: "Authoritative S3 monitor OCR text series in this window."
  overlap_lead:
    type: float
    source: chunker
    description: "Duration in seconds of the lead-in overlap zone from the prior window."
  primary_end:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where the primary ownership zone ends."
  quality_windows:
    type: markdown_block
    source: sensor
    description: "Authoritative S5 video quality track intervals in this window."
  video_duration_s:
    type: float
    source: chunker
    description: "Total duration of the resuscitation video recording in seconds."
  win_end:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where this window ends."
  win_start:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where this window begins."
  win_start_primary:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where the primary ownership zone begins."

p2_verify:
  anchor_card:
    type: yaml_block
    source: anchors
    description: "Single anchor card for the candidate event type."
  candidate_event_json:
    type: json
    source: pipeline
    description: "JSON representation of the candidate event being verified."
  clip_t0:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where the verification excerpt clip begins."
  clip_t1:
    type: float
    source: chunker
    description: "Absolute video timestamp in seconds where the verification excerpt clip ends."
  contract_slice_single:
    type: markdown_block
    source: contract
    description: "Single extraction contract slice for the candidate event type."
  contract_version:
    type: string
    source: contract
    description: "Version string of the extraction contract and prompt set."
  event_type:
    type: string
    source: pipeline
    description: "The event type identifier of the candidate event being verified."
  retrieved_exemplars:
    type: markdown_block
    source: pipeline
    description: "k=3 nearest human-adjudicated exemplars from HITL correction store. May legitimately be empty string at n=0 before HITL loop runs; render empty string gracefully."
  sensor_slice:
    type: markdown_block
    source: sensor
    description: "Sliced sensor evidence across all channels within the verification clip interval."

p3_adjudicate:
  clock_json:
    type: string
    source: clock
    description: "Clock synchronization JSON metadata."
  compression_track:
    type: markdown_block
    source: sensor
    description: "Authoritative S1 CPR sensor track compression intervals."
  contract_version:
    type: string
    source: contract
    description: "Version string of the extraction contract."
  coverage:
    type: markdown_block
    source: coverage
    description: "Case-level coverage notes and quality intervals."
  events:
    type: markdown_block
    source: reducer
    description: "Verified event candidates from P2 verify pass."
  monitor_ocr:
    type: markdown_block
    source: sensor
    description: "Authoritative S3 monitor OCR text series."
  transcript:
    type: markdown_block
    source: sensor
    description: "Authoritative S4 ASR diarized audio transcript."

p4a_team_items:
  anchor_case_high:
    type: markdown_block
    source: calibration
    description: "Calibration anchor case for global rating 9."
  anchor_case_low:
    type: markdown_block
    source: calibration
    description: "Calibration anchor case for global rating 2."
  anchor_case_mid:
    type: markdown_block
    source: calibration
    description: "Calibration anchor case for global rating 6."
  coverage_summary:
    type: markdown_block
    source: p3_adjudicate
    description: "Summary of channel coverage and degradation intervals."
  leader_presence_pct:
    type: number
    source: p3_adjudicate
    description: "Percentage of resuscitation time leader was present."
  leader_speaker_id:
    type: string
    source: p3_adjudicate
    description: "Diarized speaker ID of primary resuscitation leader."
  leader_stability:
    type: string
    source: p3_adjudicate
    description: "Stability description of leadership role across case."
  metric_version:
    type: string
    source: metrics
    description: "Version string of the objective metric definitions."
  metrics_table:
    type: markdown_block
    source: metrics
    description: "Rendered table of objective resuscitation metrics."
  n_directive:
    type: integer
    source: p3_adjudicate
    description: "Number of directive utterances by primary leader."
  n_total_directive:
    type: integer
    source: p3_adjudicate
    description: "Total directive utterances by all team members."

p4b_team_global:
  coverage_summary:
    type: markdown_block
    source: p3_adjudicate
    description: "Summary of channel coverage and degradation intervals."
  event_summary:
    type: markdown_block
    source: p3_adjudicate
    description: "Summary of adjudicated resuscitation events."
  metric_definition_version:
    type: string
    source: metrics
    description: "Version string of the objective metric definitions."
  objective_metrics_block:
    type: markdown_block
    source: metrics
    description: "Rendered block of objective resuscitation metrics."
  three_anchor_cases:
    type: markdown_block
    source: calibration
    description: "Three consensus calibration anchor cases."
  transcript_highlights:
    type: markdown_block
    source: p3_adjudicate
    description: "Notable transcript excerpts and leader communications."

p5_notes:
  cap:
    type: integer
    source: registry
    description: "Maximum repeating group item capacity in REDCap dictionary."
  coverage_windows:
    type: markdown_block
    source: coverage
    description: "Coverage degradation windows relevant to this section."
  section_abstentions:
    type: markdown_block
    source: reducer
    description: "List of abstained fields and reasons for this section."
  section_events:
    type: markdown_block
    source: reducer
    description: "Verified events belonging to this clinical section."
  section_flags:
    type: markdown_block
    source: p3_adjudicate
    description: "Adjudication flags belonging to this clinical section."
  section_name:
    type: string
    source: registry
    description: "Human-readable clinical section title."
  target_field:
    type: string
    source: registry
    description: "Target REDCap note export column name."
  truncation_report:
    type: markdown_block
    source: reducer
    description: "Report of dropped repeating group items exceeding capacity."
