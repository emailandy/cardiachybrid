[project]
name = "resus_qc"
version = "0.1.0"
description = "resus_qc pipeline"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic>=2",
    "httpx",
    "requests>=2.31.0",
    "google-auth>=2.0.0",
    "google-cloud-bigquery",
    "google-cloud-storage>=2.0.0",
    "google-genai>=1.0.0",
    "opencv-python-headless",
    "numpy",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not network'"
markers = [
    "integration: marks tests as integration",
    "network: marks tests as network"
]

[tool.ruff]
exclude = ["generated", "demo", "ui/node_modules", "ui/dist", "results", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["^generated/", "^scripts/", "^demo/", "^results/"]

[[tool.mypy.overrides]]
module = ["generated.*"]
ignore_errors = true

[tool.setuptools.packages.find]
include = ["codegen", "reducer", "ingest", "bq", "redcap", "router", "metrics", "prompts", "sensors", "pipeline", "eval", "generated", "ui", "tests"]
