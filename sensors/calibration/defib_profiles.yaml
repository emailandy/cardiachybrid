# sensors/calibration/defib_profiles.yaml — Defibrillator Acoustic Calibration Profiles
# Keyed by device model, never hardcoded in logic.
# See CR-003 and SENSOR_SPECS.md Section 3.

default:
  calibrated_on: "simvideo2.mp4 — ONE fully characterized charge tone (742.21s, 515->796 Hz over 3s, r>=0.70) plus 3 transients with tones not individually characterized, and 2 negatives. Effective n=1 for tone parameters."
  known_failure: "385.07s — 15 saw-tooth fragments in 400-1000 Hz, all restarting near 440 Hz. No monotonic tone recoverable. Cause under investigation."
  device_model: "UNKNOWN — see CR-003"
  warning: >
    Fitted, not general. Different manufacturers produce different charge
    tones. A device outside 400-1000 Hz or rising slower than 40 Hz/s would
    be missed. Per-device calibration required before production.
  freq_min_hz: 400
  freq_max_hz: 1000
  min_slope_hz_s: 40.0
  min_r: 0.70
  min_duration_s: 1.1
  transient_search_window_s: 3.0
  min_transient_ratio: 5.0

