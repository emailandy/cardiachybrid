# sensors/calibration/monitor_layouts.yaml
# Calibrated monitor display ROI layouts and OCR confidence thresholds by device model.
# Never hardcoded; every sensor profile is calibrated and versioned.

default:
  device_model: "default"
  roi: [0, 0, 1920, 1080]
  min_confidence: 0.80
  contrast_threshold: 0.25
  vitals_roi:
    hr: [100, 100, 200, 80]
    sbp: [100, 200, 200, 80]
    dbp: [100, 280, 200, 80]
    spo2: [100, 360, 200, 80]
    etco2: [100, 440, 200, 80]
  vitals_range:
    hr: [0.0, 300.0]
    sbp: [0.0, 300.0]
    dbp: [0.0, 200.0]
    spo2: [0.0, 100.0]
    etco2: [0.0, 150.0]
  warning: "Uncalibrated default monitor display layout. Calibrate ROI per device model before clinical deployment."

