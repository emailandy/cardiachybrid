# ROI configuration for video sensor overlays (S01 / S5 / S1 / S6)

timecode_roi:
  "x": 80
  "y": 120
  width: 184
  height: 24
  x_min: 80
  y_min: 120
  x_max: 264
  y_max: 144
  min_confidence: 0.60
  min_margin: 0.0070   # provisional: separates 3 historical misreads (margin <= 0.0059) from 1360 correct decodes (margin >= 0.0080)
  description: "Burned-in timestamp overlay in simvideo2.mp4 ('MM/D/YYYY HH:MM:SS.mmm AM/PM')"

profiles:
  default:
    chest_roi:
      "x": 600
      "y": 400
      width: 720
      height: 480
      description: "Default chest region of interest for CPR motion detection"
    s1_motion:
      min_fps: 15.0
      vy_bandpass_min_hz: 1.3   # 78 cpm
      vy_bandpass_max_hz: 3.0   # 180 cpm
      energy_threshold_ratio: 0.05
      # min_modulation is ROI-area dependent (absolute energy scales with pixel area) and must be re-derived whenever chest_roi changes
      min_modulation: 0.010
      min_band_power_ratio: 0.15
      cpr_peak_min_hz: 1.5
      cpr_peak_max_hz: 2.5
      min_peak_snr: 10.0
      impulse_rejection_k: 8.0
      impulse_rejection_win: 5
      impulse_min_spike_px: 2.0
      # Cadence stability discriminator (derived from 20s FFT discrete bin arithmetic, Delta_f = 3.0 CPM/bin)
      # Maximum achievable sigma for 3 samples across <=2 adjacent bins is sqrt(8) = 2.828 CPM; smallest 3-bin jump is sqrt(18) = 4.243 CPM.
      mechanical_cadence_max_std_cpm: 2.83
      manual_cadence_min_std_cpm: 8.0
      # Derived LUCAS rate envelope: nominal 102 CPM +/- 2 bins (+/- 6.0 CPM) = [96.0, 108.0] CPM (re-derive per device model on gold set expansion)
      mechanical_cadence_min_cpm: 96.0
      mechanical_cadence_max_cpm: 108.0
      mode_min_duration_s: 60.0
      # expected_cadence_cpm is a smoothing parameter, not a detection constraint — S1 must still detect off-cadence CPR
      expected_cadence_cpm: 102.0
      # rms_window_s must span at least two compression cycles at slowest passband rate (1.3 Hz / 78 cpm = 1.54s) to prevent zero-crossing envelope collapse
      rms_window_s: 1.6
      gap_merge_duration_s: 0.5
      min_active_duration_s: 2.0
      min_pause_duration_s: 1.0
      cci_reporting_floor_s: 5.0
      # Derived, not chosen. Shortest human-adjudicated interruption on
      # simvideo2.mp4 is 6.0s (n=1 case, re-derive on gold set expansion).
      # Applied to S1 clinical window (36-922s), reduces false positives from
      # 35 to 7 under consistent +/-3.0s monotonic tolerance matching (or 32
      # to 6 under any-overlap matching).
      # RECALL COST: The floor costs exactly one true interruption (GT #1: 147-155s,
      # dur=8.0s), which S1 optical flow truncated to 4.62s (150.00-154.62s) and
      # which was discarded by the >=5.0s floor (F-027), dropping recall 5/7 -> 4/7.
      # The seven surviving false positives under +/-3.0s tolerance matching and their S6 verdicts are:
      #   FP #1 (249.5-256.4s, dur=6.9s): S6 True (provider_crowding). Overlaps GT pause #2 (245-256s) but start delta (+4.5s) exceeds +/-3.0s tolerance.
      #   FP #2 (341.7-347.1s, dur=5.4s): S6 True (provider_crowding).
      #   FP #3 (351.8-357.9s, dur=6.1s): S6 True (provider_crowding).
      #   FP #4 (509.6-514.9s, dur=5.2s): S6 True (provider_crowding).
      #   FP #5 (630.2-635.5s, dur=5.3s): S6 False (unexplained >=5s false positive).
      #   FP #6 (639.4-644.7s, dur=5.2s): S6 False (unexplained >=5s false positive).
      #   FP #7 (758.2-767.0s, dur=8.8s): S6 True (provider_crowding).
      # This is a REPORTING filter; CCF counts all pauses >= 1.0s.
      confidence: 0.85
      description: "Default S1 optical flow motion detection parameters with reporting floor"
    s6_coverage:
      min_roi_visibility: 0.20
      occlusion_std_threshold: 15.0
      min_occlusion_duration_s: 0.5
      blackout_min_std: 0.5
      # Temporal difference occlusion discriminator (calibrated against characterized provider crowding dropouts)
      occlusion_entry_spike_px: 20.0   # Massive bounding pixel shift at occlusion entry/exit
      occlusion_max_roi_still_px: 1.5  # Internal stillness inside ROI during occlusion
      occlusion_min_room_active_px: 0.02 # Concurrent moving room outside ROI
      confidence: 0.90
      description: "Default S6 visual occlusion and provider crowding parameters with temporal difference gating"

  UNKNOWN:
    chest_roi:
      "x": 600
      "y": 400
      width: 720
      height: 480
      description: "Fallback chest region of interest for uncalibrated bays"
    s1_motion:
