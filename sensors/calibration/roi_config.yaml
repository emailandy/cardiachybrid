# ROI configuration for video sensor overlays (S01 / S5 / S1 / S6)

timecode_roi:
  "x": 80
  "y": 120
  width: 184
  height: 24
  x_min: 80
  y_min: 120
  x_max: 264
  y_max: 144
  description: "Burned-in timestamp overlay in simvideo2.mp4 ('MM/D/YYYY HH:MM:SS.mmm AM/PM')"

profiles:
  default:
    chest_roi:
      "x": 600
      "y": 400
      width: 720
      height: 480
      description: "Default chest region of interest for CPR motion detection"
    s1_motion:
      min_fps: 15.0
      vy_bandpass_min_hz: 1.3   # 78 cpm
      vy_bandpass_max_hz: 3.0   # 180 cpm
      energy_threshold_ratio: 0.05
      # min_modulation is ROI-area dependent (absolute energy scales with pixel area) and must be re-derived whenever chest_roi changes
      min_modulation: 0.010
      min_band_power_ratio: 0.15
      cpr_peak_min_hz: 1.5
      cpr_peak_max_hz: 2.5
      min_peak_snr: 10.0
      impulse_rejection_k: 8.0
      impulse_rejection_win: 5
      impulse_min_spike_px: 2.0
      # Cadence stability discriminator (provisional: n=1 device, 1 video; per-site calibration required)
      mechanical_cadence_max_std_cpm: 3.0
      manual_cadence_min_std_cpm: 8.0
      mode_min_duration_s: 60.0
      # expected_cadence_cpm is a smoothing parameter, not a detection constraint — S1 must still detect off-cadence CPR
      expected_cadence_cpm: 102.0
      # rms_window_s must span at least two compression cycles at slowest passband rate (1.3 Hz / 78 cpm = 1.54s) to prevent zero-crossing envelope collapse
      rms_window_s: 1.6
      gap_merge_duration_s: 0.5
      min_active_duration_s: 2.0
      min_pause_duration_s: 1.0
      cci_reporting_floor_s: 5.0
      # Derived, not chosen. Shortest human-adjudicated interruption on
      # simvideo2.mp4 is 6.0s; all 39 S1 false positives are provider-occlusion
      # dropouts under 5.0s (F-020, F-023). n=1 case — re-derive when the gold
      # set expands. This is a REPORTING filter; CCF counts all pauses >= 1.0s.
      confidence: 0.85
      description: "Default S1 optical flow motion detection parameters with reporting floor"
    s6_coverage:
      min_roi_visibility: 0.20
      occlusion_std_threshold: 15.0
      min_occlusion_duration_s: 0.5
      blackout_min_std: 0.5
      # Temporal difference occlusion discriminator (calibrated against characterized provider crowding dropouts)
      occlusion_entry_spike_px: 20.0   # Massive bounding pixel shift at occlusion entry/exit
      occlusion_max_roi_still_px: 1.5  # Internal stillness inside ROI during occlusion
      occlusion_min_room_active_px: 0.02 # Concurrent moving room outside ROI
      confidence: 0.90
      description: "Default S6 visual occlusion and provider crowding parameters with temporal difference gating"

  UNKNOWN:
    chest_roi:
      "x": 600
      "y": 400
      width: 720
      height: 480
      description: "Fallback chest region of interest for uncalibrated bays"
    s1_motion:
      min_fps: 15.0
      vy_bandpass_min_hz: 1.3   # 78 cpm
      vy_bandpass_max_hz: 3.0   # 180 cpm
      energy_threshold_ratio: 0.05
      # min_modulation is ROI-area dependent (absolute energy scales with pixel area) and must be re-derived whenever chest_roi changes
      min_modulation: 0.010
      min_band_power_ratio: 0.15
      cpr_peak_min_hz: 1.5
      cpr_peak_max_hz: 2.5
      min_peak_snr: 10.0
      impulse_rejection_k: 8.0
      impulse_rejection_win: 5
      impulse_min_spike_px: 2.0
      # Cadence stability discriminator (provisional: n=1 device, 1 video; per-site calibration required)
      mechanical_cadence_max_std_cpm: 3.0
      manual_cadence_min_std_cpm: 8.0
      mode_min_duration_s: 60.0
      # expected_cadence_cpm is a smoothing parameter, not a detection constraint — S1 must still detect off-cadence CPR
      expected_cadence_cpm: 102.0
      # rms_window_s must span at least two compression cycles at slowest passband rate (1.3 Hz / 78 cpm = 1.54s) to prevent zero-crossing envelope collapse
      rms_window_s: 1.6
      gap_merge_duration_s: 0.5
      min_active_duration_s: 2.0
      min_pause_duration_s: 1.0
      cci_reporting_floor_s: 5.0
      confidence: 0.85
      description: "Fallback S1 optical flow motion detection parameters with reporting floor"
    s6_coverage:
      min_roi_visibility: 0.20
      occlusion_std_threshold: 15.0
      min_occlusion_duration_s: 0.5
      blackout_min_std: 0.5
      occlusion_entry_spike_px: 20.0
      occlusion_max_roi_still_px: 1.5
      occlusion_min_room_active_px: 0.02
      confidence: 0.90
      description: "Fallback S6 visual occlusion and provider crowding parameters with temporal difference gating"

