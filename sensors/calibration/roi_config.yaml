      # RECALL COST: The floor costs exactly one true interruption (GT #1: 147-155s,
      # dur=8.0s), which S1 optical flow truncated to 4.62s (150.00-154.62s) and
      # which was discarded by the >=5.0s floor (F-027), dropping recall 5/7 -> 4/7.
      # The seven surviving false positives under +/-3.0s tolerance matching and their S6 verdicts are:
      #   FP #1 (249.5-256.4s, dur=6.9s): S6 True (provider_crowding). Overlaps GT pause #2 (245-256s) but start delta (+4.5s) exceeds +/-3.0s tolerance.
      #   FP #2 (341.7-347.1s, dur=5.4s): S6 True (provider_crowding).
      #   FP #3 (351.8-357.9s, dur=6.1s): S6 True (provider_crowding).
      #   FP #4 (509.6-514.9s, dur=5.2s): S6 True (provider_crowding).
      #   FP #5 (630.2-635.5s, dur=5.3s): S6 False (unexplained >=5s false positive).
      #   FP #6 (639.4-644.7s, dur=5.2s): S6 False (unexplained >=5s false positive).
      #   FP #7 (758.2-767.0s, dur=8.8s): S6 True (provider_crowding).
      # This is a REPORTING filter; CCF counts all pauses >= 1.0s.
      confidence: 0.85
      description: "Fallback S1 optical flow motion detection parameters with reporting floor"
    s6_coverage:
